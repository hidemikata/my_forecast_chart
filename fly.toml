app = "mikachart"
primary_region = "nrt"

[build]

[env]
  DB_PATH = "/data/stock.duckdb"

[[mounts]]
  source = "mikachart_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
